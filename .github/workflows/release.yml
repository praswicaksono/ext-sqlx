name: Build and Release PIE Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        php-version: ['8.4', '8.5']
        zts-mode: ['nts', 'zts']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
        env:
          phpts: ${{ matrix.zts-mode }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Extension (Unix)
        run: cargo build --release

      - name: Package for PIE
        shell: bash
        run: |
          EXT_NAME="sqlx"
          TAG_NAME="${{ github.event.release.tag_name }}"
          PHP_VER="${{ matrix.php-version }}"
          ZTS_MODE="${{ matrix.zts-mode }}"

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            OS_NAME="linux"
            LIBC="glibc-"
            BIN_EXT=".so"
            SRC_BIN="target/release/libsqlx.so"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            OS_NAME="darwin"
            LIBC="bsdlibc-"
            BIN_EXT=".so"
            SRC_BIN="target/release/libsqlx.dylib"
          fi

          ARCH=$(uname -m)
          if [[ "$ARCH" == "x86_64" || "$ARCH" == "amd64" ]]; then
            ARCH="x86_64"
          elif [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
            ARCH="arm64"
          fi

          # Expected format: php_sqlx-v1.0.0_php8.4-x86_64-linux-glibc-nts.zip
          ZIP_NAME="php_${EXT_NAME}-${TAG_NAME}_php${PHP_VER}-${ARCH}-${OS_NAME}-${LIBC}${ZTS_MODE}.zip"

          mkdir -p dist
          cp "$SRC_BIN" "dist/${EXT_NAME}${BIN_EXT}"

          cd dist
          zip "../$ZIP_NAME" *
          cd ..

          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Binary to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_PATH }}"
